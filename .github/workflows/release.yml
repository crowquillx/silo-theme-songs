name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
      - name: Install audio test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Validate
        run: |
          test -z "$(gofmt -l .)"
          test "$(jq -r .version manifest.json)" = "${GITHUB_REF_NAME#v}"
          SILO_REQUIRE_FFMPEG=1 go test -race ./...
          go vet ./...
      - run: python3 scripts/release.py
      - uses: softprops/action-gh-release@v2
        with:
          body_path: .github/RELEASE.md
          files: dist/*

  notify-catalog:
    needs: release
    runs-on: ubuntu-latest
    steps:
      # Refreshes the shared catalog right away; its schedule runs only every
      # few hours. A missing or unauthorized token warns instead of failing.
      - name: Trigger shared catalog refresh
        env:
          GH_TOKEN: ${{ secrets.CATALOG_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::CATALOG_DISPATCH_TOKEN is not set; the catalog refreshes on its schedule."
            exit 0
          fi
          if ! gh api -X POST repos/crowquillx/crowquillx-silo-plugins/dispatches -f event_type=plugin-released; then
            echo "::warning::Could not trigger the catalog refresh. CATALOG_DISPATCH_TOKEN needs Contents: write on crowquillx-silo-plugins."
          fi
