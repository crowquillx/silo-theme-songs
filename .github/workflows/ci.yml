name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
      - name: Install audio test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: test -z "$(gofmt -l .)"
      - run: SILO_REQUIRE_FFMPEG=1 go test -race ./...
      - run: go vet ./...
      - run: go build -o /tmp/plugin . && /tmp/plugin manifest > /tmp/manifest.json
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/plugin-arm64 .
